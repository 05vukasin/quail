[package]
name = "quail-docx"
description = "DOCX extractor: streaming OOXML parse with zones, properties and revision ids"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
quail-core.workspace = true
# Same major as hedgehog uses. Reading only needs inflate: the pure-Rust zlib-rs backend,
# without the zopfli compressor the `deflate` feature also pulls in.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "0.42.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "extract"
harness = false

[lints]
workspace = true
