[package]
name = "quail-docx"
description = "DOCX extractor: streaming OOXML parse with zones, properties and revision ids"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
quail-core.workspace = true
quail-ooxml = { path = "../quail-ooxml" }
quick-xml = { version = "0.42.0", default-features = false }

[dev-dependencies]
# The tests write their packages (same version and backend as quail-ooxml reads).
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "extract"
harness = false

[lints]
workspace = true
