[package]
name = "quail-fuzz"
description = "Stable-Rust mutation fuzzer for the whole quail pipeline; targets run in a resource-limited child process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quail-fuzz"
path = "src/main.rs"

[dependencies]
quail-core.workspace = true
quail-engine = { path = "../quail-engine" }
quail-hash = { path = "../quail-hash" }
quail-docx = { path = "../quail-docx" }
quail-pptx = { path = "../quail-pptx" }
quail-html = { path = "../quail-html" }
quail-text = { path = "../quail-text" }
quail-signals = { path = "../quail-signals" }
quail-refs = { path = "../quail-refs" }
quail-parties = { path = "../quail-parties" }
quail-pdf = { path = "../quail-pdf" }
quail-sketch = { path = "../quail-sketch" }
# Reads the zip packages the DOCX mutators take apart (they write zips themselves, so they can
# lie in headers). Same version and backend as quail-docx.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Raw deflate for re-zipped parts and Flate streams of generated PDFs.
miniz_oxide = "0.8.9"
# Well-formed seed PDFs (the hostile ones are written by hand in `seeds.rs`).
lopdf = { version = "0.47.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# Address-space and CPU limits of the worker process (safe wrapper over setrlimit).
rlimit = "0.10.2"

[lints]
workspace = true
