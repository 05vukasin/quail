[package]
name = "quail-refs"
description = "Document references: own numbers, cited agreements, titles, instrument kinds, page and version markers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
quail-core.workspace = true
quail-text = { path = "../quail-text" }
regex = "1.13.2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
