[package]
name = "quail-pdf"
description = "PDF extractor: text with positions, page structure and file-level PDF facts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
quail-core.workspace = true
# The text-layer verdict (`garbage_report`) behind `needs_ocr`.
quail-text = { path = "../quail-text" }
# Pure-Rust PDF parser (xref repair, object streams, RC4/AES decryption) and content-stream
# interpreter. The same stack renders pages (crate `hayro`) for OCR later.
hayro-syntax = "=0.9.0"
hayro-interpret = "=0.9.0"
# Renderer behind the `PageRaster` the extractor provides (same interpreter as above).
hayro = "=0.9.0"
# SIMD substring search (runtime CPU detection, scalar fallback) for the byte-level scans.
memchr = "2.8.3"

[dev-dependencies]
# Streaming compression and RC4/MD5 for the hostile-input matrix (examples/hostile.rs).
flate2 = "1.1.11"
md-5 = "0.11.0"
# Builds compressed bombs for the hostile-input tests.
miniz_oxide = "0.8.9"
# Writes the synthetic PDFs the tests and the bench run on.
lopdf = { version = "0.47.0", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "extract"
harness = false

[lints]
workspace = true
