# Gold task -> quail fact keys. Gold files name tasks, never fact keys, so renaming a key means
# editing this file only. Every key below is emitted on master unless the task is `pending`
# (then the keys are the planned names; fix them when the producer merges).
#
# normalize: none | text | company | date | identifier | number | bool | language
# multi:     true = set of values (every value scored), false = only the most confident one
# min_conf:  predictions below it count as abstentions
# field:     for record values, the field that is the prediction
# only / except: for record values, keep / drop records by field value ({ kind = [...] })
# aliases:   predicted value -> the gold vocabulary's value
# absent_if_equals: the gold leaves this task out when it equals the named task's value; a
#            prediction equal to that value is then neither TP nor FP
# pending:   why there is no producer yet (scored as abstentions, flagged in the report)

[task.doc_type]
description = "Kind of document (contract, invoice, annex, letter, ...)"
# quail-refs: msa contract nda sow amendment amended_restated annex change_order side_letter
# po order invoice quote (and unknown).
keys = ["ref.instrument_kind"]
normalize = "text"
# serbian-public (silver) names Serbian *aneks* `annex` (quail: `amendment`, a contract
# amendment by law) and files public notices and generic decisions under `other`.
aliases = { amendment = "annex", notice = "other", decision = "other" }

[task.doc_title]
description = "Title of the document as written"
# ref.title from the text first (conf < 1); the file properties (conf 1) are pooled too,
# so a title property wins when it is set.
keys = ["ref.title", "docx.title", "pdf.title"]
normalize = "text"

[task.party]
description = "Contracting parties / companies named as parties"
# One record per mention; deduplicated after normalization, most confident first. The DOCX
# CLM properties (plain text) are pooled too. `party.candidates` (top 10) scored F1 within
# 2 points of this on Kleister/CUAD with a much worse ECE.
keys = ["party.company", "docx.clm_first_party", "docx.clm_second_party"]
field = "surface"
normalize = "company"
multi = true
# Mentions whose only role is `mentioned` score below 0.3 (quail-parties #30): P +22 / R -3.5
# points on Kleister-NDA dev, P +29 / R -9 on CUAD dev, P +22 / R -1.4 on serbian-public.
min_conf = 0.3

[task.effective_date]
description = "Date the agreement takes effect"
# Without a stated effective date the agreement date is the effective date (Kleister-NDA:
# +5 F1; CUAD: -0.5).
keys = ["signal.date_effective", "signal.date_signed"]
normalize = "date"
# CUAD (and serbian-public) leave the effective date out when it is the agreement date.
absent_if_equals = "agreement_date"

[task.agreement_date]
description = "Date the agreement was signed or dated"
# "made and entered into as of <date>" is tagged effective by quail-signals; CUAD's
# Agreement Date is that date (F1 24.8 -> 76.2 with it pooled).
keys = ["signal.date_signed", "signal.date_effective"]
normalize = "date"

[task.expiration_date]
description = "Date the agreement ends"
keys = ["signal.date_expiry"]
normalize = "date"

[task.jurisdiction]
description = "Governing law / jurisdiction"
keys = ["clause.governing_law"]
# Canonical English name of the place (`Delaware`, `England and Wales`); `code` holds ISO 3166.
field = "jurisdiction"
normalize = "text"

[task.term]
description = "Duration of the agreement, as written (e.g. 2 years)"
keys = ["clause.term", "clause.survival"]
# `2 years`, `18 months` in the units the text uses (`duration` holds ISO 8601, `P2Y`). How
# long obligations survive is pooled: Kleister-NDA labels the confidentiality period as the term.
field = "text"
normalize = "text"

[task.contract_number]
description = "Contract / reference number"
keys = ["ref.doc_number"]
field = "raw"
normalize = "identifier"
multi = true
# A Serbian registry ("Broj:") number is the document_number task.
except = { kind = ["registry"] }

[task.document_number]
description = "The document's own registry (delovodni) number, e.g. 'Broj: 404-12/25-3'"
keys = ["ref.doc_number"]
field = "raw"
normalize = "identifier"
only = { kind = ["registry"] }

[task.parent_contract_number]
description = "Number of the contract / framework agreement this document amends, implements or reports on"
keys = ["ref.cites"]
field = "raw"
normalize = "identifier"
multi = true
except = { kind = ["procurement"] }

[task.procurement_number]
description = "Public procurement number (JN broj / referentni broj)"
keys = ["ref.cites"]
field = "raw"
normalize = "identifier"
only = { kind = ["procurement"] }

[task.tax_id]
description = "Tax identification numbers in the document (Serbian PIB, 9 digits)"
keys = ["signal.rs_pib"]
normalize = "identifier"
multi = true

[task.registration_number]
description = "Company registration numbers (Serbian maticni broj / MB, 8 digits)"
keys = ["signal.rs_mb"]
normalize = "identifier"
multi = true

[task.bank_account]
description = "Domestic bank account numbers (Serbian 3-13-2 format)"
keys = ["signal.rs_account"]
normalize = "bank_account"
multi = true

[task.iban]
description = "IBANs in the document"
keys = ["signal.iban"]
normalize = "identifier"
multi = true

[task.amount_total]
description = "Total amount of the document"
keys = ["signal.amount_total"]
normalize = "number"

[task.language]
description = "Main language of the text"
keys = ["text.lang"]
normalize = "language"

[task.script]
description = "Writing system of the text: latin | cyrillic | mixed"
keys = ["text.script"]
normalize = "text"

[task.is_scanned]
description = "The document is a scan (needs OCR)"
keys = ["ocr.is_scanned"]
normalize = "bool"
pending = "quail-pdf #7 reports pdf.pages_needing_ocr (Int), not a verdict; no OCR crate yet"

[task.near_duplicate_of]
description = "BLAKE3 of files that are near-duplicates of this one"
keys = ["sketch.near_duplicate_of"]
normalize = "identifier"
multi = true
pending = "cross-file: quail-sketch emits per-file sketch.minhash / sketch.minhash_bands; matching them across files is the service's job"

[task.items]
description = "Price lines: description, quantity, unit, unit price, total, currency, CPV"
# Gold rows (`match = "row"`) matched one to one with `item.line` records by page, price
# within 0.5 % and description token Jaccard >= 0.3; field accuracy and CPV hit@3 on the
# matched pairs (see src/items.rs).
keys = ["item.line"]
rows = true
multi = true
