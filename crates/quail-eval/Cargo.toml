[package]
name = "quail-eval"
description = "Evaluation harness for quail: gold files, scoreboards, regression gating, inspection packs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quail-eval"
path = "src/main.rs"

[dependencies]
quail-core.workspace = true
quail-io = { path = "../quail-io" }
quail-hash = { path = "../quail-hash" }
quail-text = { path = "../quail-text" }
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
quail-engine = { path = "../quail-engine" }
tempfile = "3.27"

[lints]
workspace = true
