[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party sources (see vendor/README.md); not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/05vukasin/quail"
rust-version = "1.97"

[workspace.dependencies]
quail-core = { path = "crates/quail-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Unwinding, not abort: a panic on a hostile file must end only that file (catch_unwind in
# quail-engine), never the process. Portable: no target-cpu=native anywhere; SIMD paths are
# selected at runtime.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
lto = "thin"
codegen-units = 16

# `cargo build --profile fuzz -p quail-fuzz`: optimized, but with debug assertions and overflow
# checks on so silent wraparounds become (caught) panics, and line tables for backtraces.
[profile.fuzz]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"

# Dev builds keep dependencies optimized so tests over real files stay fast.
[profile.dev.package."*"]
opt-level = 2

# Hardened hayro crates for hostile PDFs: per-file decode budget, image size checks before
# allocation, JBIG2 bitmap caps. Every change is marked `// quail:`; see vendor/README.md.
[patch.crates-io]
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
