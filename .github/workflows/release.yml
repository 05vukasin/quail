name: release
# Prebuilt `quail` binaries (default features: pure Rust, no models, no system libraries).
# A tag `v*` builds every target and publishes a GitHub release; a manual run only builds
# and uploads the archives as workflow artifacts (a dry run), as does a pull request that
# changes this file.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
  pull_request: { paths: [".github/workflows/release.yml"] }
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on an older runner image, so the binary needs only an old glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          # Intel macOS is cross-compiled on an Apple Silicon runner (pure Rust, no SDK issues).
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { targets: "${{ matrix.target }}" }
      - name: Build
        run: cargo build --release --locked -p quail-cli --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/quail
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" version
          printf 'Supplier: Example Trading Ltd\nIBAN DE89 3704 0044 0532 0130 00\n' > smoke.txt
          "$bin" scan smoke.txt --quiet | grep -q DE89370400440532013000
      - name: Package
        shell: bash
        run: |
          name=quail-${GITHUB_REF_NAME}-${{ matrix.target }}
          [ "${GITHUB_REF_TYPE}" = tag ] || name=quail-dev-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name"/
          bin=target/${{ matrix.target }}/release/quail
          if [ -f "$bin.exe" ]; then cp "$bin.exe" "$name"/; else cp "$bin" "$name"/; fi
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          echo "ARCHIVE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
