[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0",
         "NCSA", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Copyleft or native-heavy crates need an explicit decision first.
deny = [{ name = "mupdf" }, { name = "mupdf-sys" }]

[advisories]
yanked = "deny"
